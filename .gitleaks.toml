# Gitleaks config for EthiopiaLearn CI.
# Uses the default rule set, plus allowlists for specific placeholder values so
# real leaks stand out. Prefer exact values in `regexes` over path entries: a
# path entry also hides a real key pasted into that file. The two paths below
# only ever hold documented placeholders. .env*.local (where production secrets
# live locally) and test files are deliberately NOT allowlisted, so a
# force-added env file or a real key in a spec still fails CI.
[extend]
useDefault = true

[allowlist]
description = "Placeholders, examples and test fixtures — not real secrets"
paths = [
  '''\.env\.example$''',
  '''scripts/(demo-seed|e2e-smoke)\.mjs$''',
]
regexes = [
  '''REPLACE[_-][A-Z_]+''',
  '''gsk_REPLACE_ME''',
  '''gsk_REPLACE_WITH_A_FRESH_GROQ_KEY''',
  '''CHASECK_TEST-placeholder''',
  '''your-app-password''',
  '''re_xxxx''',
  '''Password123!''', # documented demo seed password
  '''Strong-passw0rd''', # made-up password in web unit tests
  '''dev-webhook-secret''',
  '''minioadmin''',
  '''ethiopialearn:ethiopialearn''', # local dev postgres dsn
  '''guest:guest@localhost''', # local dev rabbitmq
]
