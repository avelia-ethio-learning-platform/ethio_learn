# Render Blueprint — the 8 backend services (API gateway + 7 domain services).
# The frontend is NOT here: web/ deploys to Vercel.
#
# Every service builds from the same api/Dockerfile; PKG selects which workspace
# package gets built and shipped. Render exposes a service's env vars to the
# image build as Docker build args, which is how PKG reaches `ARG PKG`.
#
# Deploy:  Render Dashboard → New → Blueprint → pick this repo.
# Render prompts once for every `sync: false` value (the secrets); nothing
# sensitive is committed here.
#
# Region note: Neon lives in us-east-2, so `ohio` keeps query latency low.
# Every service must stay in the same region to keep the mesh calls cheap.

envVarGroups:
  # Shared by all 8 services. Change a value once here, not eight times.
  - name: ethiopialearn-shared
    envVars:
      - key: NODE_ENV
        value: production

      # ---- secrets: Render prompts for these during Blueprint creation ------
      - key: DATABASE_URL # Neon POOLED connection string (…-pooler.…)
        sync: false
      - key: REDIS_URL # Upstash: rediss://default:<password>@<host>:6379
        sync: false
      - key: RABBITMQ_URL # CloudAMQP: amqps://user:pass@host/vhost
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET # the dashboard's webhook secret hash, NOT a CHAPUBK_ key
        sync: false
      - key: GROQ_API_KEY # without it (or a non-gsk_ value) AI falls back to the offline mock
        sync: false
      - key: GOOGLE_CLIENT_ID # leave blank until the OAuth client exists
        sync: false

      # ---- generated once by Render, then shared verbatim across services ---
      # These three are what the service mesh trusts, so they must match
      # everywhere — that is exactly why they live in a group.
      - key: JWT_SECRET
        generateValue: true
      - key: CERT_SIGNING_SECRET
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true

      # ---- database ---------------------------------------------------------
      # Neon's free tier is connection-poor and Render free instances sleep, so
      # keep pools tiny and let them drain to zero while idle.
      - key: DB_POOL_MAX
        value: "3"
      - key: DB_POOL_MIN
        value: "0"
      # No migrations exist yet, so the first boot must create the tables.
      # Flip to false once the schema is live (see DEPLOYMENT.md).
      - key: DB_SYNC
        value: "true"

      # ---- object storage (Cloudflare R2) -----------------------------------
      # Signed URLs are signed against the S3 API endpoint; the public r2.dev
      # host only serves already-public objects and would fail signature checks.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto

      # ---- email (Brevo SMTP) ----------------------------------------------
      # SMTP_HOST being set is what selects the SMTP provider over Resend.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false" # 587 is STARTTLS, not implicit TLS
      - key: EMAIL_FROM # must be a Brevo-VERIFIED sender or every send is rejected
        sync: false
      - key: SUPPORT_EMAIL
        value: aisubyazew@gmail.com
      - key: PLATFORM_ADMIN_EMAIL
        sync: false

      # ---- public URLs ------------------------------------------------------
      # main.ts reads CORS_ORIGINS with WEB_URL as its FALLBACK, so setting
      # CORS_ORIGINS replaces the allowlist rather than extending it — it must
      # list every allowed origin, including the one in WEB_URL.
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GATEWAY_PUBLIC_URL
        sync: false
      # The frontend is on vercel.app and the API on onrender.com — different
      # sites, so the refresh cookie must be SameSite=None or it is never sent.
      - key: COOKIE_SAMESITE
        value: none

      # Matches the code default, pinned here so a model deprecation is a
      # dashboard edit rather than a redeploy.
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # Services are reachable on public *.onrender.com URLs (free plan has no
      # private inbound), so they must reject anything not carrying the shared
      # token — otherwise x-user-role could be forged straight at a service.
      - key: REQUIRE_INTERNAL_TOKEN
        value: "true"

      - key: CHAPA_MODE
        value: live
      - key: KYC_PAYOUT_THRESHOLD_ETB
        value: "10000"

services:
  # ---- API gateway: the only service the browser ever talks to --------------
  - type: web
    name: ethiopialearn-gateway
    runtime: docker
    repo: https://github.com/avelia-ethio-learning-platform/ethio_learn
    branch: main
    region: ohio
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - fromGroup: ethiopialearn-shared
      - key: PKG
        value: "@ethiopialearn/gateway"
      # NOTE: these were `fromService: {property: hostport}` (private network),
      # which is the better mechanism — but Render's free web services "can send
      # private network requests, but can't receive them", so every gateway ->
      # service call 502'd. Public URLs are the only option on the free plan.
      # Traffic leaves and re-enters Render, so services are internet-reachable;
      # REQUIRE_INTERNAL_TOKEN below is what keeps them from being open to all.
      # Switch back to fromService if these ever move to a paid instance type.
      - key: AUTH_SERVICE_URL
        value: https://ethiopialearn-auth.onrender.com
      - key: COURSE_SERVICE_URL
        value: https://ethiopialearn-course.onrender.com
      - key: ENROLLMENT_SERVICE_URL
        value: https://ethiopialearn-enrollment.onrender.com
      - key: OUTCOMES_SERVICE_URL
        value: https://ethiopialearn-outcomes.onrender.com
      - key: FINANCIAL_SERVICE_URL
        value: https://ethiopialearn-financial.onrender.com
      - key: QUALITY_SERVICE_URL
        value: https://ethiopialearn-quality.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://ethiopialearn-notification.onrender.com

  # ---- domain services -----------------------------------------------------
  # These trust the gateway's x-user-* headers, so they are only safe because
  # every mesh call carries INTERNAL_API_TOKEN. Never disable that check.
  - type: web
    name: ethiopialearn-auth
    runtime: docker
    repo: https://github.com/avelia-ethio-learning-platform/ethio_learn
    branch: main
    region: ohio
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - fromGroup: ethiopialearn-shared
      - key: PKG
        value: "@ethiopialearn/auth-service"

  - type: web
    name: ethiopialearn-course
    runtime: docker
    repo: https://github.com/avelia-ethio-learning-platform/ethio_learn
    branch: main
    region: ohio
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - fromGroup: ethiopialearn-shared
      - key: PKG
