# Scheduled jobs: wakes the sleeping Render free-tier services each job needs, then starts the job
# through the gateway (scripts/run-jobs.mjs). Secrets/vars: JOBS_TOKEN (secret), RENDER_SERVICE_URLS (variable).
#
# Instance-hour budget (Render free tier gives 750 h/month across all free services; exhausting them
# suspends every free service until next month):
#   frequent   every 4 h  -> ~90 h/month of woken-service time
#   payouts    daily      -> ~23 h/month
#   inactivity daily      -> ~23 h/month
#   total                 -> ~136 h of the 750 h
# To change the cadence, edit the cron lines below and the matching case in "Pick the job group"
# (the schedule string is the lookup key, so they must stay identical).
#
# GitHub disables scheduled workflows after 60 days without repository activity; re-enable them in the
# Actions tab (or push any commit) if the jobs stop running.
name: jobs

on:
  schedule:
    - cron: '0 */4 * * *'
    - cron: '15 2 * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Job group or single job to run
        type: choice
        required: true
        default: frequent
        options:
          - frequent
          - payouts
          - inactivity
          - financial/sweep
          - financial/effects
          - financial/nudges
          - financial/payouts
          - enrollment/inactivity

permissions: {}

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the job group
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            '0 */4 * * *') group=frequent ;;
            '15 2 * * *') group=payouts ;;
            '15 6 * * *') group=inactivity ;;
            *) group="$DISPATCH_JOB" ;;
          esac
          if [ -z "$group" ]; then echo "no job group for this trigger" >&2; exit 1; fi
          echo "GROUP=$group" >> "$GITHUB_ENV"
      - name: Wake services and run
        env:
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
          RENDER_SERVICE_URLS: ${{ vars.RENDER_SERVICE_URLS }}
        run: node scripts/run-jobs.mjs "$GROUP"
