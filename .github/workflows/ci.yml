name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; a job that needs more declares it.
permissions:
  contents: read

# One run per ref: a new push to a PR cancels its previous run; runs on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Required on main by the ruleset (.github/rulesets/main.json): api, web, e2e,
# secret-scan and lint. Renaming one of these jobs needs the ruleset updated too.
jobs:
  # ---- secret scan: block a leaked key / .env before it reaches main ----
  # This repo has had live credentials pasted into it during development, so a
  # dedicated gate is worth the 20 seconds. Fails the build on any finding.
  # Free gitleaks CLI (gitleaks-action needs a paid license for org repos), full
  # history, pinned version. The log must say "N commits scanned" with N > 0.
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  # ---- backend: build (tsc = typecheck) + unit tests ----
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ---- frontend: typecheck + unit/component tests + production build ----
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit tests with a coverage summary (no threshold yet).
      - run: pnpm test:coverage
      # No backend here: the build must pass without one (prerendered pages fall back to empty).
      - run: pnpm build

  # ---- e2e: real infra (compose) + all 8 services + API-level smoke ----
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Start infrastructure
        run: |
          docker compose up -d --wait postgres redis rabbitmq minio
          # Blocks and returns the init script's exit code (`up -d` ignores it).
          docker compose run --rm minio-init
      - name: Build and start services
        run: |
          cp api/.env.example api/.env
          pnpm -C api install --frozen-lockfile
          pnpm -C api build
          pnpm -C api seed
          bash scripts/start-backend.sh
          for _ in $(seq 1 30); do curl -sf http://localhost:4000/health > /dev/null && break; sleep 2; done
          curl -sf http://localhost:4000/health > /dev/null || { echo "the gateway is not healthy"; exit 1; }
      # Fails if any entity change shipped without its migration. A service
      # only listens once its migrations ran, so wait for each one first.
      - name: Schema drift check
        run: |
          for port in 4101 4102 4103 4104 4105 4106 4107; do
            for _ in $(seq 1 30); do curl -sf "http://localhost:$port/health" > /dev/null && break; sleep 2; done
            curl -sf "http://localhost:$port/health" > /dev/null || { echo "service on :$port is not healthy"; exit 1; }
          done
          pnpm -C api db:check
      # 5 parallel resends for one account must send 1 link (a row lock holds
      # the per-account cap). On a scratch database in the compose Postgres,
      # reached with the services' own DATABASE_URL (api/.env) under another
      # name. The spec calls AuthService directly, never the gateway, whose
      # auth-strict budget the later steps share.
      - name: Resend-verification cap under concurrency (real Postgres)
        run: |
          base="$(sed -n 's/^DATABASE_URL=//p' api/.env)"
          [ -n "$base" ] || { echo "DATABASE_URL is missing from api/.env"; exit 1; }
          docker compose exec -T postgres sh -c 'createdb -U "$POSTGRES_USER" el_ci_resend_verification'
          TEST_DATABASE_URL="${base%/*}/el_ci_resend_verification" pnpm -C api exec jest --ci services/auth/src/auth.resend-verification.db.spec.ts
      - name: End-to-end flow (educator → QO → learner → certificate)
        run: node scripts/demo-seed.mjs
      # Before the smoke step: that one hammers the login limiter on purpose.
      - name: Re-review, resumable upload and outline flows
        run: node scripts/e2e-revisions.mjs
      - name: Institution membership (invite, accept, suspend)
        run: node scripts/e2e-institution.mjs
      - name: Exactly-once payments (concurrent confirmations, payouts)
        run: node scripts/e2e-payments.mjs
      - name: Learning integrity (watch time, attempt starts, project uploads)
        run: node scripts/e2e-learning.mjs
      - name: Security hardening (internal paths, password change, email caps, coupons, pay links)
        run: node scripts/e2e-security.mjs
      # Built with the stack up, so the prerendered home page has the seeded
      # courses. Takes over a minute, which also lets the login limiter refill.
      # A wake URL on its own origin (auth's port), so the CSP check in
      # e2e/csp.spec.ts sees the browser ping it under the enforced policy.
      - name: Build web
        env:
          NEXT_PUBLIC_WAKE_URLS: http://localhost:4101/health
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: pnpm -C web exec playwright install --with-deps chromium
      # Starts `next start` on :3000 and an "API asleep" twin on :3100 itself.
      # Before the smoke step, which exhausts the login limiter on purpose.
      # The e2e scripts above can leave the login limiter (10/min per IP) full,
      # and a cached web build reaches here in under a minute, so wait out the window.
      - name: Browser smoke (Playwright)
        env:
          NEXT_PUBLIC_WAKE_URLS: http://localhost:4101/health
        run: |
          sleep 60
          pnpm -C web exec playwright test
      - name: Smoke assertions (security envelope + video progress + 429)
        run: E2E_CHECK_RATE_LIMIT=1 node scripts/e2e-smoke.mjs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail 50 || true
          tail -n 80 .devlogs/*.log || true

  # ---- lint: fails only when a rule's problem count rises above the baseline ----
  # Existing findings don't block (.github/lint-baseline.json); lower the
  # baseline with `node scripts/lint-check.mjs --update` when a PR fixes some.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm -C api install --frozen-lockfile
      - run: pnpm -C web install --frozen-lockfile
      # The api packages' types point at dist: unbuilt, type-aware rules can't see them.
      - run: pnpm -C api build
      - run: node scripts/lint-check.mjs

  # ---- audit: known vulnerabilities in production dependencies; never fails ----
  # A finding is a warning and a job summary, not a red check: the check always
  # concludes success, so it can't hold up Render's after-checks deploys.
  # Fixing them is dependency work (Dependabot PRs, Phase 11c).
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - name: Audit api
        id: api
        continue-on-error: true
        shell: bash # -o pipefail, so tee doesn't hide audit's exit code
        run: pnpm -C api audit --prod --audit-level high | tee audit-api.txt
      - name: Audit web
        id: web
        continue-on-error: true
        shell: bash # -o pipefail, so tee doesn't hide audit's exit code
        run: pnpm -C web audit --prod --audit-level high | tee audit-web.txt
      - name: Summary
        run: |
          for pkg in api web; do
            outcome=$([ "$pkg" = api ] && echo '${{ steps.api.outcome }}' || echo '${{ steps.web.outcome }}')
            if [ "$outcome" = success ]; then
              echo "### $pkg: no high or critical advisories" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=pnpm audit ($pkg)::high or critical advisories in production dependencies; see the job summary"
              { echo "### $pkg: advisories"; echo '```'; tail -n 60 "audit-$pkg.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
