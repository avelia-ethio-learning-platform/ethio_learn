name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- secret scan: block a leaked key / .env before it reaches main ----
  # This repo has had live credentials pasted into it during development, so a
  # dedicated gate is worth the 20 seconds. Fails the build on any finding.
  # Free gitleaks CLI (gitleaks-action needs a paid license for org repos), full
  # history, pinned version. The log must say "N commits scanned" with N > 0.
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  # ---- backend: build (tsc = typecheck) + unit tests ----
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ---- frontend: typecheck + unit/component tests + production build ----
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ---- e2e: real infra (compose) + all 8 services + API-level smoke ----
  e2e:
    runs-on: ubuntu-24.04
    needs: api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Start infrastructure
        run: |
          docker compose up -d --wait postgres redis rabbitmq minio
          # Blocks and returns the init script's exit code (`up -d` ignores it).
          docker compose run --rm minio-init
      - name: Build and start services
        run: |
          cp api/.env.example api/.env
          pnpm -C api install --frozen-lockfile
          pnpm -C api build
          pnpm -C api seed
          bash scripts/start-backend.sh
          for _ in $(seq 1 30); do curl -sf http://localhost:4000/health && break; sleep 2; done
      # Fails if any entity change shipped without its migration. A service
      # only listens once its migrations ran, so wait for each one first.
      - name: Schema drift check
        run: |
          for port in 4101 4102 4103 4104 4105 4106 4107; do
            for _ in $(seq 1 30); do curl -sf "http://localhost:$port/health" > /dev/null && break; sleep 2; done
            curl -sf "http://localhost:$port/health" > /dev/null || { echo "service on :$port is not healthy"; exit 1; }
          done
          pnpm -C api db:check
      - name: End-to-end flow (educator → QO → learner → certificate)
        run: node scripts/demo-seed.mjs
      # Before the smoke step: that one hammers the login limiter on purpose.
      - name: Re-review, resumable upload and outline flows
        run: node scripts/e2e-revisions.mjs
      - name: Smoke assertions (security envelope + video progress + 429)
        run: E2E_CHECK_RATE_LIMIT=1 node scripts/e2e-smoke.mjs
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail 50 || true
          tail -n 80 .devlogs/*.log || true

  # ---- CD: images to GHCR on main (deploy hooks can pull :latest or :sha) ----
  docker-api:
    runs-on: ubuntu-24.04
    needs: [api, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { pkg: '@ethiopialearn/gateway', name: gateway }
          - { pkg: '@ethiopialearn/auth-service', name: auth }
          - { pkg: '@ethiopialearn/course-service', name: course }
          - { pkg: '@ethiopialearn/enrollment-service', name: enrollment }
          - { pkg: '@ethiopialearn/outcomes-service', name: outcomes }
          - { pkg: '@ethiopialearn/financial-service', name: financial }
          - { pkg: '@ethiopialearn/quality-service', name: quality }
          - { pkg: '@ethiopialearn/notification-service', name: notification }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          build-args: PKG=${{ matrix.pkg }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}

  docker-web:
    runs-on: ubuntu-24.04
    needs: [web, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
