name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  docker:
    # lint → test → Docker build per service (spec §1 CI/CD)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        pkg:
          - '@ethiopialearn/gateway'
          - '@ethiopialearn/auth-service'
          - '@ethiopialearn/course-service'
          - '@ethiopialearn/enrollment-service'
          - '@ethiopialearn/outcomes-service'
          - '@ethiopialearn/financial-service'
          - '@ethiopialearn/quality-service'
          - '@ethiopialearn/notification-service'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          build-args: PKG=${{ matrix.pkg }}
          push: false
          # TODO: add registry login + push + deploy (ECS/Cloud Run) once
          # production infrastructure credentials exist.

  docker-web:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
