# Weekly version updates (minor and patch), grouped so a week is a handful of PRs.
# Majors are planned work (P2-45 Nest, and each future Next major), so no npm major is proposed.
# Security-update PRs are off: advisories arrive as Dependabot alerts and in CI's
# `audit` job summary (docs/DEPLOYMENT.md "Dependencies"); re-enable them once
# the alerts can be fixed by a PR. The docker ecosystem keeps the digest-pinned
# base images current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      typeorm-pg: { patterns: ['typeorm', 'pg'] }
      testing: { patterns: ['jest', 'ts-jest', '@types/jest'] }
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Majors are planned work (P2-45 Nest).
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      next-react: { patterns: ['next', 'react', 'react-dom', 'eslint-config-next'] }
      testing: { patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'happy-dom'] }
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Majors are planned work, like Next 16 (P2-44).
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # The digest and Node 22's minors only; a new Node major is a planned change.
      - dependency-name: node
        update-types: [version-update:semver-major]
