# EthiopiaLearn — full local stack.
#   Infra only (then `pnpm -C api dev`):  docker compose up -d postgres redis rabbitmq minio minio-init
#   Everything in containers:      docker compose --profile full up --build
# Images are intentionally slim: alpine bases everywhere, no fat sidecars.
name: ethiopialearn

x-service-env: &service-env
  DATABASE_URL: postgres://ethiopialearn:ethiopialearn@postgres:5432/ethiopialearn
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
  CERT_SIGNING_SECRET: ${CERT_SIGNING_SECRET:-dev-cert-secret-change-me}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:4000}
  GATEWAY_INTERNAL_URL: http://gateway:4000
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ethiopialearn
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  CHAPA_MODE: ${CHAPA_MODE:-mock}
  CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
  CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-dev-webhook-secret}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-EthiopiaLearn <no-reply@ethiopialearn.et>}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@ethiopialearn.et}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-aisubyazew@gmail.com}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  KYC_PAYOUT_THRESHOLD_ETB: ${KYC_PAYOUT_THRESHOLD_ETB:-10000}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ethiopialearn
      POSTGRES_PASSWORD: ethiopialearn
      POSTGRES_DB: ethiopialearn
    # Host port 55432: the machine's system PostgreSQL owns 5432.
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethiopialearn"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports: ["5672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    # minio/minio was removed from Docker Hub; Chainguard maintains a build of
    # the same server. Chainguard's free tier only publishes :latest, so pin the
    # digest for reproducible CI (re-pin to the current :latest digest if this
    # one is ever garbage-collected). It runs as uid 65532: a volume created by
    # the old root image needs a one-time
    #   docker run --rm -v ethiopialearn_miniodata:/data alpine chown -R 65532:65532 /data
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    # 9000 = S3 API (signed URLs); console for browsing files manually is on
    # host port 9091 (login: minioadmin / minioadmin) — 9001 is squatted by
    # Intel Graphics Command Center on Windows.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9091:9001"]
    volumes:
      - miniodata:/data

  # One-shot: create the bucket; thumbnails are public-read, videos stay private.
  # Uses the AWS CLI (minio/mc is gone from Docker Hub and Chainguard's mc image
  # has no shell for the wait loop). Fails visibly: CI runs it with
  # `docker compose run --rm minio-init` so a broken init stops the build.
  minio-init:
    image: amazon/aws-cli:2.37.8
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        s3() { aws --endpoint-url http://minio:9000 s3api "$$@"; }
        for i in $$(seq 1 60); do s3 list-buckets > /dev/null 2>&1 && break; sleep 1; done
        set -e
        s3 list-buckets > /dev/null # still down after 60 s: fail with the real error
        s3 head-bucket --bucket ethiopialearn 2> /dev/null || s3 create-bucket --bucket ethiopialearn
        s3 put-bucket-policy --bucket ethiopialearn --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::ethiopialearn/thumbnails/*"]}]}'
        echo "bucket ethiopialearn ready (thumbnails/* public-read)"

  # ---- application (profile: full) ----
  gateway:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/gateway" } }
    environment:
      <<: *service-env
      PORT: 4000
      AUTH_SERVICE_URL: http://auth:4101
      COURSE_SERVICE_URL: http://course:4102
      ENROLLMENT_SERVICE_URL: http://enrollment:4103
      OUTCOMES_SERVICE_URL: http://outcomes:4104
      FINANCIAL_SERVICE_URL: http://financial:4105
      QUALITY_SERVICE_URL: http://quality:4106
      NOTIFICATION_SERVICE_URL: http://notification:4107
    ports: ["4000:4000"]
    depends_on: [auth, course, enrollment, outcomes, financial, quality, notification]

  auth:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/auth-service" } }
    environment: { <<: *service-env, PORT: 4101 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }

  course:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/course-service" } }
    environment: { <<: *service-env, PORT: 4102 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  enrollment:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/enrollment-service" } }
    environment: { <<: *service-env, PORT: 4103 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  outcomes:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/outcomes-service" } }
    environment: { <<: *service-env, PORT: 4104 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  financial:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/financial-service" } }
    environment: { <<: *service-env, PORT: 4105 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  quality:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/quality-service" } }
    environment: { <<: *service-env, PORT: 4106 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification:
    profiles: [full]
    build: { context: ./api, args: { PKG: "@ethiopialearn/notification-service" } }
    environment: { <<: *service-env, PORT: 4107 }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    profiles: [full]
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-http://localhost:9000/ethiopialearn}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:4000
    ports: ["3000:3000"]
    depends_on: [gateway]

volumes:
  pgdata:
  miniodata:
